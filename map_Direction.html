<!DOCTYPE html>
<html>
<head>
    <title>Simulated Navigation</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            height: 80%;
            width: 100%;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
        }
    </style>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBCN_NsTb_psU3rjRw8t7-Pn7lcKJiut8w&libraries=geometry&callback=initMap" async defer></script>
</head>
<body>
    <div id="map"></div>
    <div id="controls">
        <button id="startNavigation">Start Navigation</button>
    </div>

    <script>
        let map;
        let carMarker;
        let directionsService;
        let directionsRenderer;
        let routePath = [];
        let watchId;
        let navigationActive = false;
        let previousPosition = null;

        // Define your waypoints here
        const pointA = { lat: 36.676360283268124, lng: 74.84204535079336 };
        const pointB = { lat: 36.67595657078645, lng: 74.84180405007768 };
        //const pointC = { lat: 36.665904, lng: 74.841617 };
        const finalDestination = { lat: 36.67541117805461, lng: 74.84172182247791 }; // Example

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 31.5204, lng: 74.3587 }, // Initial view over Lahore
                zoom: 12
            });

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: true, polylineOptions: { strokeColor: 'blue', strokeWeight: 5 } });

            const waypoints = [
                { location: pointA },
                { location: pointB },
             //   { location: pointC }
            ];

            directionsService.route({
                origin: { lat: 31.5204, lng: 74.3587 }, // Initial origin (can be changed to user's location later)
                destination: finalDestination,
                waypoints: waypoints,
                travelMode: google.maps.TravelMode.DRIVING
            }, (response, status) => {
                if (status === google.maps.DirectionsStatus.OK) {
                    directionsRenderer.setDirections(response);
                    routePath = response.routes[0].overview_path;
                } else {
                    console.error('Directions request failed due to ' + status);
                }
            });

            document.getElementById('startNavigation').addEventListener('click', startNavigationSimulation);
        }

        function startNavigationSimulation() {
            if (!navigationActive) {
                navigationActive = true;
                document.getElementById('startNavigation').innerText = 'Navigating...';
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(initialLocation, handleLocationError);
                } else {
                    alert("Geolocation is not supported by your browser.");
                }
            }
        }

        function initialLocation(position) {
            const initialLatLng = new google.maps.LatLng(position.coords.latitude, position.coords.longitude);
            map.setCenter(initialLatLng);
            map.setZoom(18);

            carMarker = new google.maps.Marker({
                position: initialLatLng,
                map: map,
                icon: {
                    url: 'https://maps.gstatic.com/mapfiles/ms2/img/car_maps.png', // Or your custom car icon
                    scaledSize: new google.maps.Size(30, 30)
                }
            });

            watchId = navigator.geolocation.watchPosition(updateCarPosition, handleLocationError, {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            });
        }

        function updateCarPosition(position) {
            if (navigationActive && carMarker) {
                const currentLatLng = new google.maps.LatLng(position.coords.latitude, position.coords.longitude);
                carMarker.setPosition(currentLatLng);
                map.setCenter(currentLatLng);

                if (previousPosition) {
                    const heading = google.maps.geometry.spherical.computeHeading(
                        previousPosition,
                        currentLatLng
                    );
                    map.setHeading(heading);
                }
                previousPosition = currentLatLng;
            }
        }

        function handleLocationError(error) {
            console.error('Error getting location: ', error);
            if (navigationActive) {
                document.getElementById('startNavigation').innerText = 'Start Navigation';
                navigationActive = false;
                if (watchId) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
            }
            let errorMessage = "Error getting location: ";
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    errorMessage += "User denied the request for Geolocation.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorMessage += "Location information is unavailable.";
                    break;
                case error.TIMEOUT:
                    errorMessage += "The request to get user location timed out.";
                    break;
                case error.UNKNOWN_ERROR:
                    errorMessage += "An unknown error occurred.";
                    break;
            }
            alert(errorMessage);
        }
    </script>
</body>
</html>
