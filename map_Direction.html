<!DOCTYPE html>
<html>
<head>
  <title>Fixed Route Navigation</title>
  <style>
    #map {
      height: 80vh;
      width: 100%;
    }
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    #controls {
      padding: 10px;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background-color: #4285F4;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="controls">
    <button id="navigateBtn">Start Navigation</button>
  </div>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBCN_NsTb_psU3rjRw8t7-Pn7lcKJiut8w"></script>
  <script>
    let map, directionsService, directionsRenderer, userLocation;

    // Replace these with your actual points
    const waypoints = [
      { lat: 36.67688839182212, lng: 74.84217072974035}, // Point A
      { lat: 36.67588139574511, lng: 74.84179214740072 }, // Point B
      //{ lat: 35.27826354900544, lng: 25.466422280650296 }, // Point C
      //{ lat: 35.280698068765, lng: 25.461342669957805 }, // Point D
    ];

    const finalDestination = { lat: 36.67542280345665, lng: 74.8417328501141 };

    function initMap() {
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer();

      map = new google.maps.Map(document.getElementById('map'), {
        zoom: 15,
        center: { lat: 36.6757, lng: 74.8418 }
      });

      directionsRenderer.setMap(map);

      // Get user location
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          userLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };

          calculateAndDisplayRoute();
        }, () => {
          alert("Could not get your location");
        });
      } else {
        alert("Geolocation not supported by this browser.");
      }
    }

    function calculateAndDisplayRoute() {
      directionsService.route({
        origin: userLocation,
        destination: finalDestination,
        waypoints: waypoints.map(point => ({ location: point })),
        optimizeWaypoints: false,
        travelMode: google.maps.TravelMode.DRIVING
      }, function(response, status) {
        if (status === 'OK') {
          directionsRenderer.setDirections(response);
        } else {
          alert('Directions request failed due to ' + status);
        }
      });
    }

    document.getElementById('navigateBtn').addEventListener('click', () => {
      if (!userLocation) {
        alert("User location not available yet.");
        return;
      }

      const waypointString = waypoints.map(p => `${p.lat},${p.lng}`).join('|');

      const navUrl = `https://www.google.com/maps/dir/?api=1` +
        `&origin=${userLocation.lat},${userLocation.lng}` +
        `&destination=${finalDestination.lat},${finalDestination.lng}` +
        `&waypoints=${encodeURIComponent(waypointString)}` +
        `&travelmode=driving`;

      window.location.href = navUrl; // Opens in same tab (or change to '_blank' if you want)
    });

    window.onload = initMap;
  </script>
</body>
</html>
